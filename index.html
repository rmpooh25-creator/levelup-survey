<!-- 要望・相談セクション -->
<div class="mt-6 border-t pt-4">
    <h2 class="text-lg font-bold text-gray-800 mb-2">要望・相談</h2>
    <div class="mb-4">
        <label for="request_consultation" class="block text-sm font-bold text-gray-700 mb-1">
            会社・社長・部長へ伝えたいこと・相談（任意）
        </label>
        <p class="text-xs text-gray-500 mb-2">
            現場の道具の追加希望や、経営層（社長・部長）に直接伝えたい改善提案などがあればご記入ください。
        </p>
        <input 
            type="text" 
            id="request_consultation" 
            name="request_consultation" 
            placeholder="例：〇〇の道具を追加してほしい / 新しい作業手順について相談したい" 
            class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
    </div>
</div>
